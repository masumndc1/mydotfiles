---
- hosts: localhost:laptops
  become: true
  gather_facts: true

  tasks:
    - name: Add gpg key from griffi for ghostty
      get_url:
        url: https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
        dest: /etc/apt/trusted.gpg.d/debian.griffo.io.asc
      when: ansible_distribution == "Debian"

    - name: Add apt repo for ghostty
      apt_repository:
        repo: "deb https://debian.griffo.io/apt {{ ansible_facts['distribution_release'] }} main"
        state: present
        filename: "debian.griffi.io"
      when: ansible_distribution == "Debian"

    - name: Install ghostty and related packages in debian
      apt:
        name: ["zig", "ghostty", "yazi"]
        state: present
        update_cache: true
      when: ansible_distribution == "Debian"

    - name: Install ghostty and related packages in suse
      zypper:
        name: ["zig", "ghostty"]
        state: present
        update_cache: true
      when: ansible_os_family == "Suse"

    - name: Install ghostty in freebsd
      pkgng:
        name: ["ghostty"]
        state: present
      when: ansible_os_family == "FreeBSD"

    - name: create ghostty folder under dot config directory
      become: false
      file:
        path: ~/.config/ghostty
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian" or
        ansible_os_family == "Suse" or
        ansible_os_family == "FreeBSD"

    - name: Place configuration file for ghostty
      become: false
      template:
        src: template/ghostty.j2
        dest: ~/.config/ghostty/config
        mode: "0644"
      when: ansible_distribution == "Debian" or
        ansible_os_family == "Suse" or
        ansible_os_family == "FreeBSD"
