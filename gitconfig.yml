---
- hosts: localhost:laptops
  become: true
  gather_facts: yes

  tasks:
    - name: Install git-delta package in linux
      package:
        name: git-delta
        state: present
        update_cache: true
      when: ansible_distribution == "Linux" or
        ansible_distribution == "MacOSX"

    - name: Install git-delta package in freebsd
      pkgng:
        name: git-delta
        state: present
      when: ansible_distribution == "FreeBSD"

    - name: Place gitconfig themes for delta
      become: false
      copy:
        src: themes_gitconfig
        dest: ~/themes_gitconfig
        mode: 0644

    - name: Add settings in gitconfig file
      become: false
      template:
        src: template/gitconfig.j2
        dest: ~/.gitconfig
        mode: 0644
