---
- hosts: localhost:compute:laptops:incus
  become: true
  gather_facts: yes
  ignore_errors: true

  tasks:
    - name: Install common tools in MacOS
      macports:
        name:
          [
            "fd",
            "rsync",
            "alacritty",
            "tmux",
            "neovim",
            "git-delta",
            "ripgrep",
            "bat",
            "lsd",
            "topgrade",
            "procs",
            "skim",
            "dust",
            "tealdeer",
            "zoxide",
            "monolith",
            "sd",
          ]
        state: present
        selfupdate: yes
      when: ansible_distribution == "MacOSX"

    - name: Install common tools in FreeBSD
      pkgng:
        name:
          [
            "fd-find",
            "sterm",
            "surf-browser",
            "htop",
            "cmake",
            "gmake",
            "rsync",
            "neovim",
            "ripgrep",
            "bat",
            "lsd",
            "zoxide",
            "tree-sitter",
            "tree-sitter-cli",
            "gcc",
            "git",
            "lua51-luarocks",
            "fzf",
            "ruff",
            "stylua",
            "uv",
            "py312-ty",
            "python3",
            "terminus-font",
            "font-awesome",
            "konsole",
            "py312-ansible",
            "yazi",
            "tig",
            "bhyve-firmware",
            "bhyve-rc",
            "bhyvemgr-qt5",
            "vm-bhyve",
            "x11-fonts/noto-sans-bengali",
            "x11-fonts/noto-serif-bengali",
            "nerd-fonts-jetbrainsmono"
          ]
        state: present
      when: ansible_distribution == "FreeBSD"
      tags:
        - pkg
        - freebsd

    - name: Install common tools in Opensuse
      zypper:
        name:
          [
            "fd",
            "rsync",
            "neovim",
            "zoxide",
            "git-delta",
            "ripgrep",
            "git",
            "lazygit",
          ]
        state: present
        update_cache: yes
      when: ansible_os_family == "Suse"

    - name: Install common tools in Debian
      apt:
        name:
          [
            "rsync",
            "neovim",
            "zoxide",
            "ripgrep",
            "git",
            "python3-venv",
            "rustc",
            "python-dev-is-python3",
            "xclip",
            "xsel",
          ]
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
